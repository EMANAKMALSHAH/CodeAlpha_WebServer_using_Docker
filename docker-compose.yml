version: '3.8'
services:
  web:
    build: .
    container_name: codealpha-webserver
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
